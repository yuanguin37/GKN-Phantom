# GKN-Phantom v3.0 — WAF Signature Definitions
# =============================================
# Extracted from adaptive_engine.py WAF_SIGNATURES dict.
# Each entry defines how to detect a specific WAF/security appliance
# via HTTP response headers, status codes, and body patterns.
#
# The generic entry serves as a catch-all fallback.
#
# Total: 27 signatures (3 tiers + generic)

