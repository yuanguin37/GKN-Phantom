# ---- Global configuration ------------------------------------------------
# Settings that apply to all mutation strategy execution.

global_settings:
  max_variants_per_type: 5          # Default max mutations to generate
  retry_with_mutations: true        # Whether adaptive engine should mutate
  mutation_order: "sequential"      # "sequential", "random", "priority"
  waf_specific_priorities: true     # Prioritize strategies effective against detected WAF
  log_mutations: true               # Log each mutation attempt
  fallback_to_generic: true         # If type-specific strategies fail, try generic obfuscation
